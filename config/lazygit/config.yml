disableStartupPopups: true
quitOnTopLevelReturn: true
promptToReturnFromSubprocess: false
notARepository: quit
git:
  autoFetch: false
  disableForcePushing: true
  parseEmoji: true
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
  log:
    showGraph: always
gui:
  language: en
  timeFormat: 2006-01-02 15:04
  showRandomTip: false
  showBottomLine: false
  showIcons: true
  useHunkModeInDiffView: false
os:
  editPreset: nvim
  open: "code --goto -- {{filename}}"
keybinding:
  branches:
    rebaseBranch: R
    renameBranch: r
customCommands:
  - key: <c-f>
    command: git sync
    context: global
    output: terminal
  - key: C
    command: git cz
    context: files
    output: terminal
